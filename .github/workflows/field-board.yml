name: Field board

on:
  schedule:
    - cron: '*/30 * * * *'   # GitHub може запізнюватись; relative-таймери в Discord відлічують самі
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/steam
          key: steam-state-${{ github.run_id }}
          restore-keys: steam-state-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=optional
      - run: node src/field-notmeter.js
        env:
          FIELD_WEBHOOK_URL: ${{ secrets.FIELD_WEBHOOK_URL }}
          FIELD_BOARD_MESSAGE_ID: ${{ secrets.FIELD_BOARD_MESSAGE_ID }}
      - run: node src/events-board.js
        env:
          SERVER_TZ: ${{ vars.SERVER_TZ || 'Europe/Warsaw' }}
          EVENTS_WEBHOOK_URL: ${{ secrets.EVENTS_WEBHOOK_URL }}
          EVENTS_BOARD_MESSAGE_ID: ${{ secrets.EVENTS_BOARD_MESSAGE_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ vars.GUILD_ID }}
      - run: node src/steam-news.js
        if: always()
        env:
          UPDATES_WEBHOOK_URL: ${{ secrets.UPDATES_WEBHOOK_URL }}
